name: harmonix

services:
  web:
    build:
      context: .
      args:
        HARMONIX_API_BASE_URL: ${HARMONIX_API_BASE_URL:-https://sonora.mhemery.fr}
    container_name: harmonix-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      npm_default:
        ipv4_address: 172.18.0.9

networks:
  npm_default:
    external: true
    name: npm_default
