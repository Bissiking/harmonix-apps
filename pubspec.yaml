name: harmonix_apps
description: Cross-platform music streaming app for Android, iOS, Android Auto, and Desktop.
publish_to: 'none'
version: 3.0.0+3000

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Audio
  just_audio: ^0.9.40
  just_audio_web: ^0.4.9
  audio_service: ^0.18.15
  audio_video_progress_bar: ^2.0.1

  # HTTP
  dio: ^5.7.0
  retrofit: 4.6.0

  # Cast (Chromecast / Home)
  dart_cast: ^0.4.3

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # Images
  cached_network_image: ^3.4.1

  # Web (blob URLs for authenticated audio on Flutter Web)
  web: ^1.1.1

  # Storage
  shared_preferences: ^2.3.0

  # Utilities
  rxdart: ^0.28.0
  equatable: ^2.0.5
  crypto: ^3.0.3

  # App info
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Desktop
  window_manager: ^0.4.3
  just_audio_windows: ^0.2.3
  skills: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  retrofit_generator: ^9.1.9
  json_serializable: ^6.9.0
  freezed: ^3.1.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_harmonix.png

flutter_launcher_icons:
  android: true
  ios: true

  windows:
    generate: true

  macos:
    generate: true

  image_path: "assets/images/logo_harmonix.png"